```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart | Partners In Threads</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <a class="logo" href="index.html">
            Partners In <span>Threads</span>
        </a>

        <button class="menu-toggle" aria-label="Open menu">☰</button>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>

            <a href="cart.html" class="cart-link">
                🛒 Cart <span class="cart-count">0</span>
            </a>
        </nav>
    </header>

    <!-- PAGE HEADING -->
    <section class="page-hero small">
        <p class="eyebrow">YOUR SELECTION</p>
        <h1>Shopping <em>Cart</em></h1>
    </section>

    <!-- CART SECTION -->
    <main class="cart-page">

        <div id="cart-items">
            <!-- Cart items are loaded by cart.js -->
        </div>

        <aside class="cart-summary">
            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Total</span>
                <strong id="cart-total">₹0</strong>
            </div>

            <button
                class="checkout-btn"
                type="button"
                onclick="checkout()"
            >
                Proceed to Order
            </button>

            <p class="small-note">
                Your handmade favourites are waiting!
                Contact us to complete your order.
            </p>
        </aside>

    </main>

    <!-- FOOTER -->
    <footer>
        <p class="copyright">
            © 2026 Partners In Threads. All rights reserved.
        </p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
    <script src="cart.js"></script>

</body>
</html>
```
